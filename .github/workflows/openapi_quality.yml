name: OpenAPI Quality Check

# runs when the specs or the check itself change, on any base branch
on:
  pull_request:
    paths:
      - 'api-spec/**/*.yaml'
      - 'api-spec/**/*.yml'
      - '.github/workflows/openapi_quality.yml'

permissions:
  contents: read

jobs:
  openapi_quality:
    runs-on: ubuntu-latest
    name: Lint ${{ matrix.spec.version }}
    strategy:
      fail-fast: false
      matrix:
        spec:
          - path: 'api-spec/scheduler-service-api.yaml'
            version: 'v1'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Blocks on errors. The event-receivers endpoints are unauthenticated by design (deploy
      # pipeline, internal ingress, never fronted by APIM), so .spectral.yaml scopes the OWASP
      # api2 auth rules off on those two paths only; every other endpoint is still checked.
      - name: Lint ${{ matrix.spec.path }}
        uses: pagopa/github-actions-template/openapi-lint@bfb849a1e43acbc9347afae2428a799e0d2efe88
        with:
          spec_path: ${{ matrix.spec.path }}
          ruleset: .spectral.yaml
          fail_severity: error
